
services:
  orgatelier:
    build:
      context: .
      dockerfile: dockerfile

    container_name: orgatelier
    restart: unless-stopped

    ports:
      - "3001:3001"

    env_file:
      - .env

    environment:
      NODE_ENV: production
      PORT: 3001

    volumes:
      # Persist the SQLite database outside the container.
      - ./backend/app.db:/app/backend/app.db
